name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore "Student Housing Platform/Student Housing Platform.csproj"
    - name: Build
      run: dotnet build "Student Housing Platform/Student Housing Platform.csproj" --configuration Release --no-restore
    - name: Run tests
      run: |
        dotnet test Tests/StudentHousingPlatform.Tests.csproj --no-build --verbosity normal
