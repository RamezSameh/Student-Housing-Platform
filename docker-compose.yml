version: '3.8'
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_strong_password1"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
  api:
    build: .
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=SHP;User Id=sa;Password=Your_strong_password1;TrustServerCertificate=true
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
volumes:
  mssqldata:
