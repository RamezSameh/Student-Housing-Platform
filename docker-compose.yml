services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      # CHANGE THIS to a strong password before first run
      SA_PASSWORD: "ChangeMe_Strong_Password_123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "ChangeMe_Strong_Password_123", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=StudentHousingPlatformDb;User Id=sa;Password=ChangeMe_Strong_Password_123;TrustServerCertificate=true
      # Comma-separated list of allowed frontend origins (the deployed frontend URL)
      - FrontendOrigins=https://your-frontend-domain.com
      # --- Secrets: replace the placeholders with real values ---
      - JWT__ValidIssuer=your-issuer
      - JWT__ValidAudience=your-audience
      - JWT__Secret=CHANGE_ME_to_a_long_random_secret_at_least_64_chars
      - Cloudinary__CloudName=
      - Cloudinary__ApiKey=
      - Cloudinary__ApiSecret=
      - DefaultAdmin__Email=admin@example.com
      - DefaultAdmin__Password=CHANGE_ME_Strong_Admin_Password
      - Paymob__ApiKey=
      - Paymob__PublicKey=
      - Paymob__HmacSecret=
      - Paymob__CardIntegrationId=
      - Paymob__WalletIntegrationId=
      - Paymob__IframeId=
      - Paymob__FrontendResultUrl=https://your-frontend-domain.com/payment/result
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssqldata:
